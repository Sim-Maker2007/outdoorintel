    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #0a0a12; color: #e8e4df; font-family: system-ui, -apple-system, sans-serif; }

        #map { position: fixed; inset: 0; z-index: 0; }

        /* Dark map tiles */
        .leaflet-tile-pane { filter: saturate(0.3) brightness(0.45) contrast(1.1); }
        .leaflet-control-attribution { display: none; }
        .leaflet-control-zoom { border: none !important; }
        .leaflet-control-zoom a {
            background: rgba(5,5,8,0.9) !important;
            color: #888 !important;
            border: 1px solid rgba(255,255,255,0.08) !important;
            width: 32px !important; height: 32px !important;
            line-height: 32px !important; font-size: 16px !important;
        }
        .leaflet-control-zoom a:hover { background: rgba(5,5,8,1) !important; color: #c97c5e !important; }

        /* Custom popups */
        .leaflet-popup-content-wrapper {
            background: rgba(5,5,8,0.95) !important;
            color: #e8e4df !important;
            border-radius: 12px !important;
            border: 1px solid rgba(201,124,94,0.15);
            backdrop-filter: blur(16px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5) !important;
        }
        .leaflet-popup-tip { background: rgba(5,5,8,0.95) !important; }
        .leaflet-popup-content { margin: 14px 16px !important; }
        .leaflet-popup-close-button { color: #666 !important; font-size: 18px !important; }
        .leaflet-popup-close-button:hover { color: #c97c5e !important; }

        /* Header */
        #header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            padding: 16px 24px;
            display: flex; align-items: center; justify-content: space-between;
            background: linear-gradient(to bottom, rgba(5,5,8,0.95) 0%, rgba(5,5,8,0.6) 70%, transparent 100%);
            pointer-events: none;
        }
        #header > * { pointer-events: auto; }
        #header a { text-decoration: none; }

        /* Sidebar */
        #sidebar {
            position: fixed; top: 0; right: 0; bottom: 0;
            width: 360px; z-index: 1001;
            background: rgba(5,5,8,0.96);
            backdrop-filter: blur(24px);
            border-left: 1px solid rgba(201,124,94,0.12);
            transform: translateX(100%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            padding-top: 80px;
        }
        #sidebar.open { transform: translateX(0); }

        /* Filters */
        #filters {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            z-index: 999;
            display: flex; gap: 6px;
            padding: 10px 16px;
            background: rgba(5,5,8,0.88);
            backdrop-filter: blur(16px);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.07);
        }
        .fchip {
            padding: 6px 14px; border-radius: 20px;
            font-size: 12px; font-weight: 600;
            border: 1px solid rgba(255,255,255,0.1);
            background: transparent; color: #666;
            cursor: pointer; transition: all 0.2s; white-space: nowrap;
        }
        .fchip.active { color: #fff; border-color: currentColor; background: rgba(255,255,255,0.05); }
        .fchip:hover { background: rgba(255,255,255,0.08); }

        /* Trip Stops */
        .trip-stop {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 14px; border-radius: 10px;
            background: rgba(255,255,255,0.025);
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 6px; transition: background 0.2s;
            cursor: pointer;
        }
        .trip-stop:hover { background: rgba(255,255,255,0.06); }
        .snum {
            width: 26px; height: 26px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 700; flex-shrink: 0;
        }
        .srem { opacity: 0; transition: opacity 0.15s; cursor: pointer; color: #ff6b6b; background: none; border: none; font-size: 16px; padding: 4px; }
        .trip-stop:hover .srem { opacity: 1; }

        /* Help Hint */
        #help-hint {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            z-index: 998; padding: 10px 24px;
            background: rgba(5,5,8,0.7); border-radius: 10px;
            font-size: 13px; color: #555; transition: opacity 1.5s; pointer-events: none;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(201,124,94,0.25); border-radius: 3px; }

        /* Profile Modal */
        #profile-modal-overlay {
            position: fixed; inset: 0; z-index: 2000;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center;
            padding: 24px;
        }
        #profile-modal-overlay.open { display: flex; }
        #profile-modal {
            background: rgba(10,10,18,0.98);
            border: 1px solid rgba(201,124,94,0.15);
            border-radius: 16px;
            width: 100%; max-width: 520px; max-height: 80vh;
            overflow-y: auto; position: relative;
            box-shadow: 0 24px 64px rgba(0,0,0,0.6);
        }
        #profile-modal .pm-header {
            padding: 20px 24px 16px; border-bottom: 1px solid rgba(255,255,255,0.06);
            position: sticky; top: 0; background: rgba(10,10,18,0.98); z-index: 1;
        }
        #profile-modal .pm-body { padding: 16px 24px 24px; }
        #profile-modal .pm-close {
            position: absolute; top: 16px; right: 16px;
            background: none; border: none; color: #666; font-size: 20px;
            cursor: pointer; padding: 4px 8px; border-radius: 6px;
            transition: all 0.2s;
        }
        #profile-modal .pm-close:hover { color: #c97c5e; background: rgba(255,255,255,0.05); }
        #profile-modal .pm-section {
            margin-bottom: 16px;
        }
        #profile-modal .pm-section-title {
            font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px;
            font-weight: 700; color: #888; margin-bottom: 6px;
        }
        #profile-modal .pm-section-content {
            font-size: 13px; color: #bbb; line-height: 1.6;
        }
        #profile-modal .pm-tag {
            display: inline-block; padding: 3px 10px; border-radius: 12px;
            font-size: 11px; font-weight: 600; margin: 2px 4px 2px 0;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
        }

        /* Responsive */
        @media (max-width: 768px) {
            #sidebar { width: 100%; }
            #filters { left: 12px; right: 12px; transform: none; overflow-x: auto; justify-content: flex-start; }
            #help-hint { left: 12px; right: 12px; transform: none; text-align: center; }
            #profile-modal { max-width: 100%; max-height: 90vh; }
        }
    </style>

<body>

    <!-- Map -->
    <div id="map"></div>

    <!-- Header -->
    <div id="header">
        <div style="display:flex; align-items:center; gap:14px;">
            <a href="../index.html" style="display:flex; align-items:center;">
                <img src="../assets/logo/logo.jpg" alt="Outdoor Intel" style="height:32px; filter:brightness(1.6) saturate(0.6);">
            </a>
            <div style="height:18px; width:1px; background:rgba(255,255,255,0.15);"></div>
            <span style="font-size:13px; font-weight:700; color:#c97c5e; letter-spacing:1px; text-transform:uppercase;">Trip Planner</span>
        </div>
        <div style="display:flex; align-items:center; gap:14px;">
            <a href="map.html" style="font-size:13px; color:#666; transition:color 0.2s;" onmouseenter="this.style.color='#c97c5e'" onmouseleave="this.style.color='#666'">Full Map</a>
            <button id="sidebar-toggle" style="padding:7px 16px; background:rgba(201,124,94,0.1); border:1px solid rgba(201,124,94,0.25); border-radius:8px; color:#c97c5e; font-size:13px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:8px; transition:all 0.2s;" onmouseenter="this.style.background='rgba(201,124,94,0.2)'" onmouseleave="this.style.background='rgba(201,124,94,0.1)'">
                My Trip
                <span id="trip-count" style="min-width:20px; height:20px; display:flex; align-items:center; justify-content:center; border-radius:10px; background:rgba(201,124,94,0.3); font-size:11px; font-weight:700;">0</span>
            </button>
        </div>
    </div>

    <!-- Sidebar -->
    <div id="sidebar">
        <div style="padding:0 20px 20px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h2 style="font-size:18px; font-weight:700; color:#e8e4df;">My Trip</h2>
                <button id="clear-trip" style="font-size:12px; color:#666; background:none; border:none; cursor:pointer; padding:4px 8px; transition:color 0.2s;" onmouseenter="this.style.color='#ff6b6b'" onmouseleave="this.style.color='#666'">Clear All</button>
            </div>
            <div id="trip-stats" style="display:none; margin-bottom:16px; padding:10px 14px; background:rgba(201,124,94,0.06); border-radius:8px; font-size:12px; color:#999;"></div>
            <div id="trip-list">
                <div style="text-align:center; padding:48px 16px; color:#444;">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.5" style="margin:0 auto 16px;">
                        <path d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l5.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/>
                    </svg>
                    <p style="font-size:13px; line-height:1.5;">Click spots on the map to explore and build your route</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Filters -->
    <div id="filters">
        <button class="fchip active" data-cat="fishing" style="color:#4a9eff;">Fishing</button>
        <button class="fchip active" data-cat="hunting" style="color:#ff8c42;">Hunting</button>
        <button class="fchip active" data-cat="camping" style="color:#4ade80;">Camping</button>
        <button class="fchip active" data-cat="kayaking" style="color:#22d3ee;">Kayaking</button>
        <button class="fchip active" data-cat="skiing" style="color:#a78bfa;">Skiing</button>
        <button class="fchip active" data-cat="hiking" style="color:#fbbf24;">Hiking</button>
    </div>

    <!-- Profile Modal -->
    <div id="profile-modal-overlay">
        <div id="profile-modal">
            <button class="pm-close" onclick="window.closeProfile()">&times;</button>
            <div class="pm-header" id="pm-header"></div>
            <div class="pm-body" id="pm-body"></div>
        </div>
    </div>

    <!-- Help Hint -->
    <div id="help-hint">Click spots to explore &middot; Build your route with the trip planner</div>

<script>
// ==================== CONFIG ====================
const CATEGORIES = ['fishing', 'hunting', 'camping', 'kayaking', 'skiing', 'hiking'];
const CAT_COLORS = {
    fishing: '#4a9eff', hunting: '#ff8c42', camping: '#4ade80',
    kayaking: '#22d3ee', skiing: '#a78bfa', hiking: '#fbbf24'
};

// ==================== STATE ====================
const state = {
    allSpots: [], trip: [],
    activeFilters: new Set(CATEGORIES),
    sidebarOpen: false
};

// ==================== MAP ====================
const map = L.map('map', {
    center: [56, -96],
    zoom: 4,
    minZoom: 3,
    maxZoom: 13,
    zoomControl: false
});

L.control.zoom({ position: 'bottomright' }).addTo(map);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
}).addTo(map);

// ==================== MARKERS ====================
const markerLayers = {};
const routeLayer = L.layerGroup().addTo(map);
let allMarkers = [];

function createCircleIcon(color) {
    return L.divIcon({
        className: '',
        html: `<div style="width:12px;height:12px;border-radius:50%;background:${color};border:2px solid rgba(255,255,255,0.9);box-shadow:0 0 8px ${color}80, 0 2px 6px rgba(0,0,0,0.4);"></div>`,
        iconSize: [12, 12],
        iconAnchor: [6, 6],
        popupAnchor: [0, -10]
    });
}

function createTripIcon(color, num) {
    return L.divIcon({
        className: '',
        html: `<div style="width:24px;height:24px;border-radius:50%;background:${color};border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;box-shadow:0 0 12px ${color}80, 0 2px 8px rgba(0,0,0,0.5);font-family:system-ui,sans-serif;">${num}</div>`,
        iconSize: [24, 24],
        iconAnchor: [12, 12],
        popupAnchor: [0, -16]
    });
}

function popupContent(spot) {
    const feats = spot.features
        ? spot.features.slice(0, 3).join(' &middot; ')
        : spot.primary_species
            ? spot.primary_species.slice(0, 3).join(' &middot; ')
            : '';
    const inTrip = state.trip.find(s => s.slug === spot.slug && s.cat === spot.cat);
    const addBtnText = inTrip ? 'Added &#10003;' : 'Add to Trip';
    const addBtnOpacity = inTrip ? '0.5' : '1';

    return `
        <div style="min-width:180px;">
            <div style="font-size:10px;text-transform:uppercase;letter-spacing:1.5px;font-weight:700;color:${CAT_COLORS[spot.cat]};">${spot.cat}</div>
            <div style="font-size:15px;font-weight:700;margin-top:3px;color:#e8e4df;">${spot.name}</div>
            <div style="font-size:12px;color:#888;margin-top:3px;">${spot.province || ''}</div>
            ${feats ? `<div style="font-size:11px;color:#666;margin-top:6px;">${feats}</div>` : ''}
            <div style="display:flex;gap:8px;margin-top:14px;">
                <button onclick="window.addSpotToTrip('${spot.slug}','${spot.cat}')" style="flex:1;padding:7px 0;background:rgba(201,124,94,0.15);border:1px solid rgba(201,124,94,0.3);border-radius:8px;color:#c97c5e;font-size:12px;font-weight:700;cursor:pointer;opacity:${addBtnOpacity};" ${inTrip ? 'disabled' : ''}>${addBtnText}</button>
                <button onclick="window.viewProfile('${spot.slug}','${spot.cat}')" style="flex:1;padding:7px 0;background:rgba(45,90,61,0.15);border:1px solid rgba(45,90,61,0.3);border-radius:8px;color:#7a9b8e;font-size:12px;font-weight:700;cursor:pointer;">View Profile</button>
            </div>
        </div>
    `;
}

// ==================== DATA ====================
async function loadAllData() {
    const results = await Promise.all(
        CATEGORIES.map(cat =>
            fetch(`../data/${cat}.json`)
                .then(r => r.json())
                .then(data => data.spots.map(s => ({ ...s, cat })))
        )
    );
    return results.flat();
}

// ==================== SPOT RENDERING ====================
function renderSpots() {
    // Remove all existing markers
    allMarkers.forEach(m => map.removeLayer(m.marker));
    allMarkers = [];

    const validSpots = state.allSpots.filter(s =>
        s.coordinates && s.coordinates.lat && s.coordinates.lng &&
        state.activeFilters.has(s.cat)
    );

    validSpots.forEach(spot => {
        const marker = L.marker(
            [spot.coordinates.lat, spot.coordinates.lng],
            { icon: createCircleIcon(CAT_COLORS[spot.cat]) }
        );
        marker.bindPopup(popupContent(spot), { maxWidth: 280 });
        marker.addTo(map);
        allMarkers.push({ marker, spot });
    });

    // Re-apply trip number icons
    updateTripMarkers();
}

function updateTripMarkers() {
    // Update markers that are in the trip to show numbered icons
    allMarkers.forEach(({ marker, spot }) => {
        const tripIdx = state.trip.findIndex(s => s.slug === spot.slug && s.cat === spot.cat);
        if (tripIdx >= 0) {
            marker.setIcon(createTripIcon(CAT_COLORS[spot.cat], tripIdx + 1));
        } else {
            marker.setIcon(createCircleIcon(CAT_COLORS[spot.cat]));
        }
    });
}

// ==================== TRIP MANAGEMENT ====================
window.addSpotToTrip = function(slug, cat) {
    const spot = state.allSpots.find(s => s.slug === slug && s.cat === cat);
    if (!spot) return;
    if (state.trip.find(s => s.slug === slug && s.cat === cat)) return;
    state.trip.push(spot);
    updateTripUI();
    updateRoute();
    updateTripMarkers();
    map.closePopup();
    if (!state.sidebarOpen) {
        state.sidebarOpen = true;
        document.getElementById('sidebar').classList.add('open');
    }
};

window.tripRemove = function(idx) {
    state.trip.splice(idx, 1);
    updateTripUI();
    updateRoute();
    updateTripMarkers();
};

window.tripFlyTo = function(idx) {
    const spot = state.trip[idx];
    if (spot && spot.coordinates) {
        map.flyTo([spot.coordinates.lat, spot.coordinates.lng], 8, { duration: 0.8 });
    }
};

function clearTrip() {
    state.trip = [];
    updateTripUI();
    updateRoute();
    updateTripMarkers();
}

// ==================== PROFILE MODAL ====================
window.viewProfile = function(slug, cat) {
    const spot = state.allSpots.find(s => s.slug === slug && s.cat === cat);
    if (!spot) return;
    map.closePopup();

    const color = CAT_COLORS[cat] || '#c97c5e';
    const tags = spot.features || spot.primary_species || spot.primary_game || [];
    const inTrip = state.trip.find(s => s.slug === slug && s.cat === cat);

    let headerHtml = `
        <div style="font-size:10px;text-transform:uppercase;letter-spacing:1.5px;font-weight:700;color:${color};">${cat}</div>
        <h2 style="font-size:20px;font-weight:800;margin-top:4px;color:#e8e4df;">${spot.name}</h2>
        <div style="display:flex;align-items:center;gap:10px;margin-top:6px;">
            <span style="font-size:12px;color:#888;">${spot.province || ''}</span>
            ${spot.scout_level ? `<span style="font-size:10px;font-weight:700;color:${color};background:${color}18;padding:2px 8px;border-radius:8px;">${spot.scout_level}</span>` : ''}
        </div>
    `;

    let bodyHtml = '';

    if (tags.length) {
        bodyHtml += `<div class="pm-section">
            <div class="pm-section-title">${spot.primary_species ? 'Species' : 'Features'}</div>
            <div>${tags.map(t => `<span class="pm-tag" style="color:${color};border-color:${color}30;">${t}</span>`).join('')}</div>
        </div>`;
    }

    if (spot.description) {
        const shortDesc = spot.description.split('\n')[0];
        bodyHtml += `<div class="pm-section">
            <div class="pm-section-title">Overview</div>
            <div class="pm-section-content">${shortDesc}</div>
        </div>`;
    }

    if (spot.seasonal_tips) {
        bodyHtml += `<div class="pm-section">
            <div class="pm-section-title">Seasonal Tips</div>
            <div class="pm-section-content">${spot.seasonal_tips}</div>
        </div>`;
    }

    if (spot.best_time) {
        const shortBest = spot.best_time.split('\n').slice(0, 3).join('<br>');
        bodyHtml += `<div class="pm-section">
            <div class="pm-section-title">Best Time</div>
            <div class="pm-section-content">${shortBest}</div>
        </div>`;
    }

    if (spot.terrain) {
        bodyHtml += `<div class="pm-section">
            <div class="pm-section-title">Terrain</div>
            <div class="pm-section-content">${spot.terrain.split('.').slice(0, 3).join('.') + '.'}</div>
        </div>`;
    }

    if (spot.regulations) {
        bodyHtml += `<div class="pm-section">
            <div class="pm-section-title">Regulations</div>
            <div class="pm-section-content">${spot.regulations.split('.').slice(0, 3).join('.') + '.'}</div>
        </div>`;
    }

    // Action buttons
    const addBtnDisabled = inTrip ? 'disabled style="flex:1;padding:9px 0;background:rgba(201,124,94,0.1);border:1px solid rgba(201,124,94,0.2);border-radius:8px;color:#c97c5e;font-size:13px;font-weight:700;cursor:default;opacity:0.5;"' : 'style="flex:1;padding:9px 0;background:rgba(201,124,94,0.15);border:1px solid rgba(201,124,94,0.3);border-radius:8px;color:#c97c5e;font-size:13px;font-weight:700;cursor:pointer;"';
    const addBtnText = inTrip ? 'Added &#10003;' : 'Add to Trip';

    bodyHtml += `<div style="display:flex;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.06);">
        <button onclick="window.addSpotToTrip('${slug}','${cat}');window.closeProfile();" ${addBtnDisabled}>${addBtnText}</button>
        <a href="${cat}/${slug}.html" style="flex:1;padding:9px 0;background:rgba(45,90,61,0.15);border:1px solid rgba(45,90,61,0.3);border-radius:8px;color:#7a9b8e;font-size:13px;font-weight:700;text-decoration:none;text-align:center;">Full Page</a>
    </div>`;

    document.getElementById('pm-header').innerHTML = headerHtml;
    document.getElementById('pm-body').innerHTML = bodyHtml;
    document.getElementById('profile-modal-overlay').classList.add('open');
};

window.closeProfile = function() {
    document.getElementById('profile-modal-overlay').classList.remove('open');
};

function updateRoute() {
    routeLayer.clearLayers();
    if (state.trip.length < 2) return;

    const coords = state.trip
        .filter(s => s.coordinates)
        .map(s => [s.coordinates.lat, s.coordinates.lng]);

    if (coords.length < 2) return;

    const routeLine = L.polyline(coords, {
        color: '#c97c5e',
        weight: 3,
        opacity: 0.8,
        dashArray: '8, 6',
        smoothFactor: 1
    });
    routeLayer.addLayer(routeLine);
}

// ==================== UI ====================
function updateTripUI() {
    const list = document.getElementById('trip-list');
    const countEl = document.getElementById('trip-count');
    const stats = document.getElementById('trip-stats');

    countEl.textContent = state.trip.length;

    if (state.trip.length === 0) {
        list.innerHTML = `<div style="text-align:center; padding:48px 16px; color:#444;">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.5" style="margin:0 auto 16px;">
                <path d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l5.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"/>
            </svg>
            <p style="font-size:13px; line-height:1.5;">Click spots on the map to explore and build your route</p>
        </div>`;
        stats.style.display = 'none';
        return;
    }

    const provs = new Set(state.trip.map(s => s.province).filter(Boolean));
    stats.style.display = 'block';
    stats.innerHTML = `${state.trip.length} stop${state.trip.length !== 1 ? 's' : ''} &middot; ${provs.size} province${provs.size !== 1 ? 's' : ''}`;

    list.innerHTML = state.trip.map((s, i) => `
        <div class="trip-stop" onclick="window.tripFlyTo(${i})">
            <div class="snum" style="background:${CAT_COLORS[s.cat]}18; color:${CAT_COLORS[s.cat]}; border:1px solid ${CAT_COLORS[s.cat]}35;">${i + 1}</div>
            <div style="flex:1; min-width:0;">
                <div style="font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#ddd;">${s.name}</div>
                <div style="font-size:10px; color:#666; text-transform:uppercase; letter-spacing:0.5px; margin-top:1px;">${s.cat}${s.province ? ' &middot; ' + s.province : ''}</div>
            </div>
            <button class="srem" onclick="event.stopPropagation(); window.tripRemove(${i})" title="Remove">&times;</button>
        </div>
    `).join('');
}

// ==================== FILTERS ====================
document.querySelectorAll('.fchip').forEach(btn => {
    btn.addEventListener('click', () => {
        const cat = btn.dataset.cat;
        if (state.activeFilters.has(cat)) {
            if (state.activeFilters.size === 1) return;
            state.activeFilters.delete(cat);
            btn.classList.remove('active');
        } else {
            state.activeFilters.add(cat);
            btn.classList.add('active');
        }
        renderSpots();
    });
});

// ==================== EVENTS ====================
document.getElementById('sidebar-toggle').addEventListener('click', () => {
    state.sidebarOpen = !state.sidebarOpen;
    document.getElementById('sidebar').classList.toggle('open', state.sidebarOpen);
});

document.getElementById('clear-trip').addEventListener('click', clearTrip);

document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
        const modal = document.getElementById('profile-modal-overlay');
        if (modal.classList.contains('open')) {
            window.closeProfile();
        } else if (state.sidebarOpen) {
            state.sidebarOpen = false;
            document.getElementById('sidebar').classList.remove('open');
        }
    }
});

document.getElementById('profile-modal-overlay').addEventListener('click', function(e) {
    if (e.target === this) window.closeProfile();
});

// ==================== INIT ====================
async function init() {
    try {
        const allSpots = await loadAllData();
        state.allSpots = allSpots;
        renderSpots();

        // Fade help hint
        setTimeout(() => {
            const hint = document.getElementById('help-hint');
            if (hint) {
                hint.style.opacity = '0';
                setTimeout(() => hint.remove(), 1500);
            }
        }, 6000);

    } catch (err) {
        console.error('Failed to initialize:', err);
    }
}

init();
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js');}</script>

    <!-- Global Search Overlay -->
    <div id="global-search-overlay" class="fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm hidden" style="transition:opacity 0.2s">
        <div class="flex items-start justify-center pt-[15vh] px-4">
            <div class="bg-white rounded-2xl w-full max-w-2xl overflow-hidden" style="box-shadow:0 25px 50px rgba(0,0,0,0.25)">
                <div class="flex items-center gap-3 px-6 py-4 border-b border-[#2d5a3d]/10">
                    <svg class="w-5 h-5 text-[#6b6359] flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    <input id="global-search-input" type="text" placeholder="Search 499+ spots across Canada..." class="flex-1 text-lg text-[#3e3127] placeholder-[#6b6359]/50 outline-none bg-transparent" autocomplete="off">
                    <kbd class="hidden sm:inline-block text-xs text-[#6b6359] bg-[#f5f3f0] px-2 py-1 rounded font-mono">ESC</kbd>
                </div>
                <div id="global-search-results" class="max-h-[50vh] overflow-y-auto">
                    <div class="px-6 py-8 text-center text-[#6b6359] text-sm">Type to search fishing spots, hunting areas, campgrounds, trails...</div>
                </div>
            </div>
        </div>
    </div>
    <script>
    (function(){
        var overlay = document.getElementById('global-search-overlay');
        var input = document.getElementById('global-search-input');
        var results = document.getElementById('global-search-results');
        var toggle = document.getElementById('global-search-toggle');
        var spotsData = null;
        var CATS = ['fishing','hunting','camping','kayaking','skiing','hiking'];
        var CAT_ICONS = {fishing:'🎣',hunting:'🦌',camping:'⛺',kayaking:'🛶',skiing:'⛷️',hiking:'🥾'};

        function isEn() { return !window.location.pathname.startsWith('/fr'); }
        function basePath() {
            var p = window.location.pathname;
            var depth = (p.match(/\//g)||[]).length - 1;
            if (p === '/' || p === '/index.html') return '';
            var segs = [];
            for (var i = 0; i < depth; i++) segs.push('..');
            return segs.join('/') || '.';
        }

        async function loadSpots() {
            if (spotsData) return spotsData;
            spotsData = [];
            var lang = isEn() ? 'en' : 'fr';
            var base = basePath();
            for (var i = 0; i < CATS.length; i++) {
                try {
                    var r = await fetch((base ? base + '/' : '/') + 'data/' + CATS[i] + '.json');
                    var d = await r.json();
                    d.spots.forEach(function(s) {
                        spotsData.push({
                            name: s.name,
                            slug: s.slug,
                            province: s.province,
                            category: CATS[i],
                            species: s.primary_species || s.primary_game || s.features || [],
                            scout_level: s.scout_level || ''
                        });
                    });
                } catch(e) {}
            }
            return spotsData;
        }

        function renderResults(matches) {
            if (!matches.length) {
                results.innerHTML = '<div class="px-6 py-8 text-center text-[#6b6359] text-sm">No spots found. Try a different search term.</div>';
                return;
            }
            var lang = isEn() ? 'en' : 'fr';
            var base = basePath();
            var html = matches.slice(0, 12).map(function(s) {
                var href = (base ? base + '/' : '/') + lang + '/' + s.category + '/' + s.slug + '.html';
                var icon = CAT_ICONS[s.category] || '';
                var sub = s.province + ' • ' + s.category.charAt(0).toUpperCase() + s.category.slice(1);
                if (s.species.length) sub += ' • ' + s.species.slice(0,2).join(', ');
                return '<a href="' + href + '" class="flex items-center gap-4 px-6 py-3 hover:bg-[#fef9f3] transition-colors">' +
                    '<span class="text-xl flex-shrink-0">' + icon + '</span>' +
                    '<div class="flex-1 min-w-0">' +
                    '<div class="font-semibold text-[#2d5a3d] truncate">' + s.name + '</div>' +
                    '<div class="text-xs text-[#6b6359] truncate">' + sub + '</div>' +
                    '</div>' +
                    '<span class="text-xs font-bold text-[#c97c5e] flex-shrink-0">' + s.scout_level + '</span>' +
                    '</a>';
            }).join('');
            if (matches.length > 12) {
                html += '<div class="px-6 py-3 text-center text-xs text-[#6b6359]">' + (matches.length - 12) + ' more results...</div>';
            }
            results.innerHTML = html;
        }

        function search(q) {
            if (!spotsData) return;
            q = q.toLowerCase().trim();
            if (!q) {
                results.innerHTML = '<div class="px-6 py-8 text-center text-[#6b6359] text-sm">Type to search fishing spots, hunting areas, campgrounds, trails...</div>';
                return;
            }
            var matches = spotsData.filter(function(s) {
                return s.name.toLowerCase().includes(q) ||
                    s.province.toLowerCase().includes(q) ||
                    s.category.toLowerCase().includes(q) ||
                    s.species.some(function(sp) { return sp.toLowerCase().includes(q); });
            });
            renderResults(matches);
        }

        function open() {
            overlay.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            input.value = '';
            input.focus();
            loadSpots();
            results.innerHTML = '<div class="px-6 py-8 text-center text-[#6b6359] text-sm">Type to search fishing spots, hunting areas, campgrounds, trails...</div>';
        }

        function close() {
            overlay.classList.add('hidden');
            document.body.style.overflow = '';
        }

        if (toggle) toggle.addEventListener('click', open);
        overlay.addEventListener('click', function(e) { if (e.target === overlay) close(); });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') close();
            if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); open(); }
        });
        input.addEventListener('input', function() { search(this.value); });
    })();
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
