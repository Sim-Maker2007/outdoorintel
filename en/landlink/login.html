<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log In — LandLink</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/landlink/landlink.css">
</head>
<body>

<main class="ll-auth">
  <h1>Welcome back</h1>
  <p class="sub">We\u2019ll email you a magic link to log in.</p>
  <form id="login-form">
    <div class="ll-field">
      <label>Email</label>
      <input type="email" name="email" required>
    </div>
    <button type="submit" class="ll-booking-submit">Send magic link</button>
  </form>
  <div class="alt">New to LandLink? <a href="/en/signup">Create an account</a></div>
</main>

<script type="module">
import { renderNav } from '/assets/landlink/js/nav.js';
import { supabase } from '/assets/landlink/js/supabase-client.js';
renderNav();

const url = new URL(location.href);
const next = url.searchParams.get('next') || '/en/landlink/dashboard';

document.getElementById('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const email = new FormData(e.target).get('email');
  const { error } = await supabase.auth.signInWithOtp({
    email,
    options: { emailRedirectTo: `${location.origin}/en/auth-callback.html?next=${encodeURIComponent(next)}` }
  });
  if (error) { alert('Could not send link: ' + error.message); return; }
  e.target.innerHTML = `<div class="ll-empty" style="padding:20px 0">
    <div style="font-size:32px">\u2709\uFE0F</div>
    <p style="margin-top:12px">Check your inbox \u2014 we sent a magic link to <b>${email}</b>.</p>
  </div>`;
});
</script>

</body>
</html>
