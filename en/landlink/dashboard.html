<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard — LandLink</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/landlink/landlink.css">
</head>
<body>

<main class="ll-dash">
  <div class="ll-dash-head">
    <h1 id="greeting">Dashboard</h1>
    <div id="cta"></div>
  </div>

  <div class="ll-tabs" id="tabs"></div>
  <div id="content"><div class="ll-empty">Loading...</div></div>
</main>

<script type="module">
import { renderNav } from '/assets/landlink/js/nav.js';
import { supabase, getCurrentProfile, formatPrice } from '/assets/landlink/js/supabase-client.js';
renderNav();

const state = { profile: null, tab: null };

async function boot() {
  const profile = await getCurrentProfile();
  if (!profile) { window.location.href = '/en/landlink/login?next=/en/dashboard'; return; }
  state.profile = profile;
  document.getElementById('greeting').textContent = `Hi ${profile.full_name?.split(' ')[0] || 'there'}`;

  const role = profile.role;
  const isLandowner = role === 'landowner' || role === 'both' || role === 'admin';
  const isHunter = role === 'hunter' || role === 'both' || role === 'admin';

  const tabs = [];
  if (isLandowner) { tabs.push({ id: 'my-parcels', label: 'My Parcels' }); tabs.push({ id: 'incoming', label: 'Incoming Requests' }); }
  if (isHunter) { tabs.push({ id: 'my-requests', label: 'My Requests' }); }
  if (role === 'admin') tabs.push({ id: 'admin', label: 'Admin' });

  document.getElementById('tabs').innerHTML = tabs.map((t,i) => `<button data-tab="${t.id}" class="${i===0?'active':''}">${t.label}</button>`).join('');
  document.getElementById('cta').innerHTML = isLandowner
    ? '<a href="/en/list-your-land" class="ll-btn-accent">+ List a parcel</a>'
    : '<a href="/en/parcels" class="ll-btn-accent">Browse parcels</a>';

  document.getElementById('tabs').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    document.querySelectorAll('#tabs button').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); loadTab(b.dataset.tab);
  });
  if (tabs.length) loadTab(tabs[0].id);
}

async function loadTab(tab) {
  state.tab = tab;
  const el = document.getElementById('content');
  el.innerHTML = '<div class="ll-empty">Loading...</div>';

  if (tab === 'my-parcels') {
    const { data } = await supabase.from('landlink_parcels')
      .select('id,name,province,municipality,species,status,photos,price_cents,price_unit,review_count,avg_rating')
      .eq('owner_id', state.profile.user_id).order('created_at', { ascending: false });
    el.innerHTML = (data && data.length) ? data.map(parcelRow).join('')
      : emptyState('No parcels yet', 'List your first parcel to start attracting vetted hunters.', '/en/list-your-land', 'List a parcel');
  }

  else if (tab === 'incoming') {
    const { data } = await supabase.from('landlink_hunt_requests')
      .select('id,date_from,date_to,party_size,weapon,status,message,created_at,parcel_id,hunter_id,landlink_parcels(name,photos)')
      .in('parcel_id', await myParcelIds()).order('created_at', { ascending: false });
    el.innerHTML = (data && data.length) ? data.map(requestRow).join('')
      : emptyState('No requests yet', 'When hunters apply to your parcels they\u2019ll show up here.', null, null);
  }

  else if (tab === 'my-requests') {
    const { data } = await supabase.from('landlink_hunt_requests')
      .select('id,date_from,date_to,party_size,weapon,status,message,created_at,parcel_id,landlink_parcels(name,photos,province,municipality)')
      .eq('hunter_id', state.profile.user_id).order('created_at', { ascending: false });
    el.innerHTML = (data && data.length) ? data.map(requestRow).join('')
      : emptyState('No requests yet', 'Find a parcel and apply \u2014 your applications will show up here.', '/en/parcels', 'Browse parcels');
  }

  else if (tab === 'admin') {
    const { data } = await supabase.from('landlink_parcels')
      .select('id,name,province,owner_id,status,created_at')
      .eq('status', 'pending_review').order('created_at', { ascending: true });
    el.innerHTML = (data && data.length) ? `<h3 style="font-size:15px;margin-bottom:12px">Pending review (${data.length})</h3>` + data.map(adminRow).join('')
      : emptyState('Nothing in the queue', 'All listings are reviewed.', null, null);
  }
}

async function myParcelIds() {
  const { data } = await supabase.from('landlink_parcels').select('id').eq('owner_id', state.profile.user_id);
  return (data || []).map(p => p.id);
}

function parcelRow(p) {
  const photo = (p.photos && p.photos[0]) || 'https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=200&auto=format&fit=crop';
  const badge = `<span class="ll-badge ll-badge-${p.status.replace('_','-')}">${p.status.replace('_',' ')}</span>`;
  return `<a class="ll-list-row" href="/en/parcels/${p.id}">
    <div class="ll-list-thumb" style="background-image:url('${photo}')"></div>
    <div class="ll-list-body">
      <h4>${p.name} ${badge}</h4>
      <div class="meta">${[p.municipality, p.province].filter(Boolean).join(', ')} \u00b7 ${formatPrice(p.price_cents, p.price_unit)} \u00b7 ${p.review_count || 0} reviews</div>
    </div>
  </a>`;
}

function requestRow(r) {
  const parcel = r.landlink_parcels || {};
  const photo = (parcel.photos && parcel.photos[0]) || 'https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=200&auto=format&fit=crop';
  const loc = [parcel.municipality, parcel.province].filter(Boolean).join(', ');
  const badge = `<span class="ll-badge ll-badge-${r.status}">${r.status}</span>`;
  return `<div class="ll-list-row">
    <div class="ll-list-thumb" style="background-image:url('${photo}')"></div>
    <div class="ll-list-body">
      <h4>${parcel.name || 'Parcel'} ${badge}</h4>
      <div class="meta">${loc} \u00b7 ${r.date_from} \u2192 ${r.date_to} \u00b7 party of ${r.party_size} \u00b7 ${r.weapon}</div>
      ${r.message ? `<div class="meta" style="margin-top:6px;color:var(--ink)">\u201C${r.message}\u201D</div>` : ''}
    </div>
  </div>`;
}

function adminRow(p) {
  return `<div class="ll-list-row">
    <div class="ll-list-body">
      <h4>${p.name} <span class="ll-badge ll-badge-pending">pending</span></h4>
      <div class="meta">${p.province} \u00b7 submitted ${new Date(p.created_at).toLocaleDateString()}</div>
    </div>
    <button onclick="approveParcel('${p.id}')" class="ll-btn">Approve</button>
  </div>`;
}

window.approveParcel = async function(id) {
  const { error } = await supabase.from('landlink_parcels').update({ status: 'active' }).eq('id', id);
  if (error) { alert('Could not approve: ' + error.message); return; }
  loadTab('admin');
};

function emptyState(title, body, cta, ctaLabel) {
  return `<div class="ll-empty">
    <h3 style="font-size:16px;color:var(--ink);margin-bottom:6px">${title}</h3>
    <p style="margin-bottom:${cta?'16px':'0'}">${body}</p>
    ${cta ? `<a href="${cta}" class="ll-btn">${ctaLabel}</a>` : ''}
  </div>`;
}

boot();
</script>

</body>
</html>
