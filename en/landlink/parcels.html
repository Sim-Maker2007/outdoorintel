<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Browse Parcels — LandLink</title>
<meta name="description" content="Browse private hunting parcels across Canada. Filter by species, weapon, province, and price.">
<link rel="alternate" hreflang="en" href="https://landlink.outdoorintel.ca/en/parcels">
<link rel="alternate" hreflang="fr" href="https://landlink.outdoorintel.ca/fr/parcels">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="/assets/landlink/landlink.css">
<style>
  body { overflow: hidden; }
  .ll-search-results { overflow-y: auto; }
</style>
</head>
<body>

<div class="ll-search-layout">
  <div class="ll-search-results">
    <div class="ll-search-filters" id="filters">
      <button class="ll-filter-pill active" data-filter="all">All</button>
      <button class="ll-filter-pill" data-filter="species:whitetail">Whitetail</button>
      <button class="ll-filter-pill" data-filter="species:moose">Moose</button>
      <button class="ll-filter-pill" data-filter="species:elk">Elk</button>
      <button class="ll-filter-pill" data-filter="species:black_bear">Black bear</button>
      <button class="ll-filter-pill" data-filter="species:goose">Goose</button>
      <button class="ll-filter-pill" data-filter="species:turkey">Turkey</button>
      <button class="ll-filter-pill" data-filter="species:coyote">Coyote</button>
      <button class="ll-filter-pill" data-filter="weapon:archery">Archery</button>
      <button class="ll-filter-pill" data-filter="weapon:rifle">Rifle</button>
      <button class="ll-filter-pill" data-filter="price:free">Free access</button>
    </div>
    <div style="display:flex;gap:8px;padding:0 20px;margin-bottom:8px">
      <input type="text" id="search-input" placeholder="Search by name, town, or province..." style="flex:1;padding:8px 14px;border:1px solid var(--line);border-radius:8px;font-size:13px">
      <select id="sort-select" style="padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff">
        <option value="newest">Newest</option>
        <option value="price_low">Price: low to high</option>
        <option value="price_high">Price: high to low</option>
        <option value="rating">Highest rated</option>
      </select>
    </div>
    <div class="ll-search-count" id="count">Loading parcels...</div>
    <div class="ll-search-grid" id="grid"></div>
  </div>
  <div class="ll-map-pane">
    <div id="map"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
import { renderNav } from '/assets/landlink/js/nav.js';
import { supabase, formatPrice } from '/assets/landlink/js/supabase-client.js';
import { esc } from '/assets/landlink/js/utils.js';
import { loadFavourites, attachFavHandlers, isFavourite } from '/assets/landlink/js/favourites.js';
renderNav();
loadFavourites();

// ---------- state ----------
const state = {
  parcels: [],
  filtered: [],
  filter: 'all',
  locationQuery: '',
  markers: new Map(),
  hoveredId: null,
  sort: 'newest'
};

// ---------- map ----------
const map = L.map('map', { center: [56, -96], zoom: 4, minZoom: 3, maxZoom: 13, zoomControl: true });
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OSM' }).addTo(map);

// ---------- data load ----------
async function load() {
  const url = new URL(window.location.href);
  const initialFilter = url.searchParams.get('species') ? 'species:' + url.searchParams.get('species')
                      : url.searchParams.get('weapon') ? 'weapon:' + url.searchParams.get('weapon')
                      : url.searchParams.get('price_unit') === 'free' ? 'price:free'
                      : 'all';
  state.locationQuery = (url.searchParams.get('location') || '').trim().toLowerCase();
  if (initialFilter !== 'all') {
    document.querySelectorAll('.ll-filter-pill').forEach(b => b.classList.toggle('active', b.dataset.filter === initialFilter));
  }
  state.filter = initialFilter;

  const { data, error } = await supabase
    .from('landlink_parcels')
    .select('id,name,province,municipality,species,weapons,price_cents,price_unit,photos,avg_rating,review_count,acres,centroid_lat,centroid_lng,season_start,season_end,max_hunters')
    .eq('status', 'active')
    .order('created_at', { ascending: false })
    .limit(200);

  state.parcels = (!error && data && data.length) ? data : demoParcels();
  applyFilter();
}

function applyFilter() {
  const f = state.filter;
  const q = state.locationQuery;
  state.filtered = state.parcels.filter(p => {
    // Species / weapon / price filter
    if (f !== 'all') {
      if (f.startsWith('species:') && !(p.species || []).includes(f.split(':')[1])) return false;
      if (f.startsWith('weapon:') && !(p.weapons || []).includes(f.split(':')[1])) return false;
      if (f === 'price:free' && p.price_unit !== 'free') return false;
    }
    // Location text search (matches province, municipality, or parcel name)
    if (q) {
      const haystack = [p.name, p.municipality, p.province].filter(Boolean).join(' ').toLowerCase();
      if (!haystack.includes(q)) return false;
    }
    return true;
  });

  // Sort
  if (state.sort === 'price_low') state.filtered.sort((a,b) => (a.price_cents||0) - (b.price_cents||0));
  else if (state.sort === 'price_high') state.filtered.sort((a,b) => (b.price_cents||0) - (a.price_cents||0));
  else if (state.sort === 'rating') state.filtered.sort((a,b) => (b.avg_rating||0) - (a.avg_rating||0));

  render();
}

// ---------- render ----------
function render() {
  document.getElementById('count').textContent = `${state.filtered.length} ${state.filtered.length === 1 ? 'parcel' : 'parcels'}`;

  // list
  const grid = document.getElementById('grid');
  grid.innerHTML = state.filtered.map(p => cardHTML(p)).join('');
  grid.querySelectorAll('[data-id]').forEach(el => {
    el.addEventListener('mouseenter', () => focusMarker(el.dataset.id));
    el.addEventListener('mouseleave', () => unfocusMarker(el.dataset.id));
  });
  attachFavHandlers(grid);

  // map pins
  state.markers.forEach(m => map.removeLayer(m));
  state.markers.clear();
  const bounds = [];
  state.filtered.forEach(p => {
    if (!p.centroid_lat || !p.centroid_lng) return;
    const priceLabel = p.price_unit === 'free' ? 'Free' : `$${Math.round((p.price_cents || 0) / 100)}`;
    const marker = L.marker([p.centroid_lat, p.centroid_lng], {
      icon: L.divIcon({
        className: '', html: `<div class="ll-price-pin">${priceLabel}</div>`,
        iconSize: [60, 26], iconAnchor: [30, 13]
      })
    }).addTo(map);
    marker.on('click', () => { window.location.href = `/en/landlink/parcels/${p.id}`; });
    state.markers.set(p.id, marker);
    bounds.push([p.centroid_lat, p.centroid_lng]);
  });
  if (bounds.length) map.fitBounds(bounds, { padding: [40, 40], maxZoom: 8 });
}

function focusMarker(id) {
  const m = state.markers.get(id);
  if (m) m.getElement().querySelector('.ll-price-pin')?.classList.add('active');
}
function unfocusMarker(id) {
  const m = state.markers.get(id);
  if (m) m.getElement().querySelector('.ll-price-pin')?.classList.remove('active');
}

function cardHTML(p) {
  const photo = (p.photos && p.photos[0]) || demoPhoto(p.id);
  const rating = p.avg_rating ? p.avg_rating.toFixed(1) : (p.review_count ? '\u2014' : 'New');
  const reviews = p.review_count ? ` (${p.review_count})` : '';
  const price = formatPrice(p.price_cents, p.price_unit);
  const location = [p.municipality, p.province].filter(Boolean).join(', ');
  const species = (p.species || []).slice(0, 2).map(s => s.replace('_', ' ')).join(' \u00b7 ');
  return `
    <a class="ll-card" href="/en/landlink/parcels/${esc(p.id)}" data-id="${esc(p.id)}">
      <div class="ll-card-img" style="background-image:url('${esc(photo)}')">
        ${p.price_unit === 'free' ? '<div class="ll-card-badge">Free access</div>' : ''}
        <div class="ll-card-fav ${isFavourite(p.id) ? 'active' : ''}" data-parcel-id="${esc(p.id)}" aria-label="Save"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div>
      </div>
      <div class="ll-card-body">
        <div class="ll-card-row">
          <div class="ll-card-title">${esc(p.name)}</div>
          <div class="ll-card-rating">&#9733; ${rating}${reviews}</div>
        </div>
        <div class="ll-card-meta">${esc(location) || '\u2014'}</div>
        <div class="ll-card-meta">${esc(species) || 'Multi-species'}${p.acres ? ` \u00b7 ${p.acres} acres` : ''}</div>
        <div class="ll-card-price"><strong>${price}</strong></div>
      </div>
    </a>`;
}

// ---------- filter UI ----------
document.getElementById('filters').addEventListener('click', e => {
  const btn = e.target.closest('.ll-filter-pill'); if (!btn) return;
  document.querySelectorAll('.ll-filter-pill').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.filter = btn.dataset.filter;
  applyFilter();
});

// ---------- demo fallback ----------
function demoPhoto(seed) {
  const photos = [
    'https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=600&auto=format&fit=crop',
    'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600&auto=format&fit=crop',
    'https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=600&auto=format&fit=crop',
    'https://images.unsplash.com/photo-1448375240586-882707db888b?w=600&auto=format&fit=crop',
    'https://images.unsplash.com/photo-1502082553048-f009c37129b9?w=600&auto=format&fit=crop',
    'https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=600&auto=format&fit=crop',
    'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600&auto=format&fit=crop',
    'https://images.unsplash.com/photo-1511497584788-876760111969?w=600&auto=format&fit=crop'
  ];
  let h = 0; for (const c of String(seed || '')) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return photos[h % photos.length];
}
function demoParcels() {
  return [
    { id: 'demo-1', name: 'Pontiac River Woodlot', province: 'QC', municipality: 'Shawville', species: ['whitetail','coyote'], weapons: ['archery','rifle'], price_cents: 20000, price_unit: 'season', acres: 210, avg_rating: 4.9, review_count: 14, centroid_lat: 45.60, centroid_lng: -76.48, max_hunters: 3 },
    { id: 'demo-2', name: 'Northern Ontario Bush Camp', province: 'ON', municipality: 'Temiskaming Shores', species: ['moose','black_bear'], weapons: ['rifle','muzzleloader'], price_cents: 40000, price_unit: 'week', acres: 640, avg_rating: 4.8, review_count: 22, centroid_lat: 47.50, centroid_lng: -79.68, max_hunters: 2 },
    { id: 'demo-3', name: 'Grain Field Goose Hunt', province: 'SK', municipality: 'Moose Jaw', species: ['goose','duck'], weapons: ['shotgun'], price_cents: 5000, price_unit: 'day', acres: 320, avg_rating: 5.0, review_count: 9, centroid_lat: 50.39, centroid_lng: -105.53, max_hunters: 6 },
    { id: 'demo-4', name: 'Laurentides Mixed Forest', province: 'QC', municipality: 'Mont-Laurier', species: ['whitetail','black_bear'], weapons: ['archery','crossbow','rifle'], price_cents: 0, price_unit: 'free', acres: 180, avg_rating: null, review_count: 0, centroid_lat: 46.55, centroid_lng: -75.50, max_hunters: 2 },
    { id: 'demo-5', name: 'Prairie Whitetail Ranch', province: 'AB', municipality: 'Red Deer', species: ['whitetail','mule_deer'], weapons: ['archery','rifle'], price_cents: 60000, price_unit: 'season', acres: 1200, avg_rating: 4.7, review_count: 31, centroid_lat: 52.27, centroid_lng: -113.81, max_hunters: 4 },
    { id: 'demo-6', name: 'Maritime Woodlot', province: 'NB', municipality: 'Fredericton', species: ['whitetail','turkey'], weapons: ['archery','shotgun'], price_cents: 15000, price_unit: 'season', acres: 95, avg_rating: 4.6, review_count: 7, centroid_lat: 45.96, centroid_lng: -66.64, max_hunters: 2 },
    { id: 'demo-7', name: 'Interior BC Backcountry', province: 'BC', municipality: 'Kamloops', species: ['elk','mule_deer'], weapons: ['rifle','archery'], price_cents: 35000, price_unit: 'week', acres: 840, avg_rating: 4.9, review_count: 18, centroid_lat: 50.67, centroid_lng: -120.33, max_hunters: 3 },
    { id: 'demo-8', name: 'Cornfield Coyote Control', province: 'ON', municipality: 'Chatham-Kent', species: ['coyote'], weapons: ['rifle'], price_cents: 0, price_unit: 'free', acres: 400, avg_rating: null, review_count: 0, centroid_lat: 42.40, centroid_lng: -82.19, max_hunters: 2 },
    { id: 'demo-9', name: 'Manitoba Marsh Edge', province: 'MB', municipality: 'Delta Beach', species: ['duck','goose'], weapons: ['shotgun'], price_cents: 8000, price_unit: 'day', acres: 160, avg_rating: 4.8, review_count: 11, centroid_lat: 50.19, centroid_lng: -98.35, max_hunters: 4 },
    { id: 'demo-10', name: 'Mauricie Back 40', province: 'QC', municipality: 'Shawinigan', species: ['whitetail','coyote'], weapons: ['archery','crossbow'], price_cents: 12000, price_unit: 'season', acres: 120, avg_rating: 4.5, review_count: 5, centroid_lat: 46.56, centroid_lng: -72.75, max_hunters: 1 }
  ];
}

// Search input
const searchInput = document.getElementById('search-input');
if (state.locationQuery) searchInput.value = state.locationQuery;
let searchTimer;
searchInput.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { state.locationQuery = searchInput.value.trim().toLowerCase(); applyFilter(); }, 250);
});

// Sort select
document.getElementById('sort-select').addEventListener('change', e => {
  state.sort = e.target.value;
  applyFilter();
});

load();
</script>

</body>
</html>
