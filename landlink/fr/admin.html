<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — LandLink</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/public/css/landlink.css">
</head>
<body>

<main class="ll-dash" style="max-width:1200px">
  <div class="ll-dash-head">
    <h1>Admin</h1>
    <a href="/fr/dashboard" class="ll-btn-ghost">Retour au tableau de bord</a>
  </div>

  <div id="stats" class="ll-admin-stats"></div>

  <div class="ll-tabs" id="tabs"></div>
  <div id="content"><div class="ll-empty">Chargement&hellip;</div></div>
</main>

<script type="module">
import { renderNav } from '/public/js/nav.js';
import {
  supabase, getCurrentProfile, formatPrice, getActivities,
  activityIcon, activityLabel
} from '/public/js/supabase-client.js';
renderNav();

const state = { profile: null, tab: 'parcels' };

async function boot() {
  state.profile = await getCurrentProfile();
  if (!state.profile) { location.href = '/fr/login?next=/fr/admin'; return; }
  if (state.profile.role !== 'admin') {
    document.querySelector('main').innerHTML = '<div class="ll-empty"><h3>Admin seulement</h3><p>Votre compte n\u2019a pas accès admin.</p></div>';
    return;
  }

  await getActivities();
  await loadStats();

  const tabs = [
    { id: 'parcels',     label: 'Parcelles' },
    { id: 'listings',    label: 'Annonces' },
    { id: 'credentials', label: 'Qualifications' },
    { id: 'flags',       label: 'Signalements' },
    { id: 'bookings',    label: 'Réservations' },
    { id: 'audit',       label: 'Journal admin' }
  ];
  document.getElementById('tabs').innerHTML = tabs.map((t, i) =>
    `<button data-tab="${t.id}" class="${i === 0 ? 'active' : ''}">${t.label}</button>`
  ).join('');
  document.getElementById('tabs').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    document.querySelectorAll('#tabs button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    loadTab(b.dataset.tab);
  });
  loadTab('parcels');
}

async function loadStats() {
  const { data } = await supabase.from('landlink_admin_stats').select('*').maybeSingle();
  const s = data || {};
  const card = (label, value) =>
    `<div class="ll-stat-card"><div class="ll-stat-v">${value ?? 0}</div><div class="ll-stat-l">${label}</div></div>`;
  document.getElementById('stats').innerHTML = [
    card('Parcelles actives', s.parcels_active),
    card('Parcelles en attente', s.parcels_pending),
    card('Annonces actives', s.listings_active),
    card('Annonces en attente', s.listings_pending),
    card('Réservations en attente', s.bookings_pending),
    card('Réservations approuvées', s.bookings_approved),
    card('GMV à ce jour', `${Math.round((s.gmv_cents || 0) / 100).toLocaleString('fr-CA')}$`),
    card('Utilisateurs', s.users_total),
    card('Qualifications en attente', s.credentials_pending),
    card('Signalements ouverts', s.flags_open)
  ].join('');
}

async function loadTab(tab) {
  state.tab = tab;
  const el = document.getElementById('content');
  el.innerHTML = '<div class="ll-empty">Chargement&hellip;</div>';

  if (tab === 'parcels') return loadParcels(el);
  if (tab === 'listings') return loadListings(el);
  if (tab === 'credentials') return loadCredentials(el);
  if (tab === 'flags') return loadFlags(el);
  if (tab === 'bookings') return loadBookings(el);
  if (tab === 'audit') return loadAudit(el);
}

async function loadParcels(el) {
  const { data } = await supabase.from('landlink_parcels')
    .select('id,name,province,municipality,status,created_at,owner_id')
    .in('status', ['pending_review','active','paused'])
    .order('status').order('created_at', { ascending: false })
    .limit(200);
  el.innerHTML = (data || []).map(p => rowHTML({
    title: p.name,
    sub: `${[p.municipality, p.province].filter(Boolean).join(', ')} · ${p.status}`,
    status: p.status,
    actions: [
      p.status !== 'active'  && { label: 'Approuver',   action: 'approve',   kind: 'parcel', id: p.id },
      p.status === 'active'  && { label: 'Suspendre',   action: 'suspend',   kind: 'parcel', id: p.id },
      p.status === 'paused'  && { label: 'Réactiver',   action: 'unsuspend', kind: 'parcel', id: p.id },
                               { label: 'Retirer',     action: 'reject',    kind: 'parcel', id: p.id, danger: true }
    ]
  })).join('') || emptyHTML('Aucune parcelle');
  wireActions(el);
}

async function loadListings(el) {
  const { data } = await supabase.from('landlink_listings')
    .select('id,title,category,status,price_cents,price_unit,created_at,parcel_id,landlink_parcels(name,province)')
    .in('status', ['pending_review','active','paused'])
    .order('status').order('created_at', { ascending: false })
    .limit(200);
  el.innerHTML = (data || []).map(l => rowHTML({
    title: `${activityIcon(l.category)} ${l.title || activityLabel(l.category, 'fr')}`,
    sub: `${l.landlink_parcels?.name || ''} · ${l.landlink_parcels?.province || ''} · ${formatPrice(l.price_cents, l.price_unit)} · ${l.status}`,
    status: l.status,
    actions: [
      l.status !== 'active'  && { label: 'Approuver',  action: 'approve',   kind: 'listing', id: l.id },
      l.status === 'active'  && { label: 'Suspendre',  action: 'suspend',   kind: 'listing', id: l.id },
      l.status === 'paused'  && { label: 'Réactiver',  action: 'unsuspend', kind: 'listing', id: l.id },
                               { label: 'Retirer',    action: 'reject',    kind: 'listing', id: l.id, danger: true }
    ]
  })).join('') || emptyHTML('Aucune annonce');
  wireActions(el);
}

async function loadCredentials(el) {
  const { data } = await supabase.from('landlink_user_credentials')
    .select('id,type,number,document_url,verified_at,expires_on,user_id,landlink_profiles(full_name,province)')
    .is('verified_at', null)
    .order('created_at', { ascending: true })
    .limit(100);
  el.innerHTML = (data || []).map(c => rowHTML({
    title: `${c.landlink_profiles?.full_name || 'Utilisateur'} · ${c.type.replace('_', ' ')}`,
    sub: `${c.number ? 'No ' + c.number + ' · ' : ''}${c.document_url ? 'document téléversé' : 'aucun document'}`,
    status: 'pending',
    actions: [
      { label: 'Vérifier', action: 'verify', kind: 'credential', id: c.id },
      { label: 'Refuser',  action: 'reject', kind: 'credential', id: c.id, danger: true }
    ]
  })).join('') || emptyHTML('Aucune qualification en attente');
  wireActions(el);
}

async function loadFlags(el) {
  const { data } = await supabase.from('landlink_flags')
    .select('id,subject_type,subject_id,reason,detail,status,created_at,reporter_id')
    .in('status', ['open','reviewing'])
    .order('created_at', { ascending: false })
    .limit(100);
  el.innerHTML = (data || []).map(f => rowHTML({
    title: `${f.subject_type} · ${f.reason}`,
    sub: `${f.detail || ''} · soumis ${new Date(f.created_at).toLocaleDateString('fr-CA')}`,
    status: f.status,
    actions: [
      { label: 'Résoudre', action: 'approve', kind: 'flag', id: f.id },
      { label: 'Rejeter',  action: 'reject',  kind: 'flag', id: f.id, danger: true }
    ]
  })).join('') || emptyHTML('Aucun signalement ouvert');
  wireActions(el);
}

async function loadBookings(el) {
  const { data } = await supabase.from('landlink_bookings')
    .select('id,status,date_from,date_to,party_size,total_cents,created_at,landlink_listings(title,category),landlink_parcels(name)')
    .order('created_at', { ascending: false })
    .limit(100);
  el.innerHTML = (data || []).map(b => rowHTML({
    title: `${b.landlink_parcels?.name || '—'} · ${activityIcon(b.landlink_listings?.category)} ${activityLabel(b.landlink_listings?.category, 'fr')}`,
    sub: `${b.date_from} → ${b.date_to} · groupe de ${b.party_size} · ${Math.round((b.total_cents || 0) / 100)}$`,
    status: b.status,
    actions: []
  })).join('') || emptyHTML('Aucune réservation');
}

async function loadAudit(el) {
  const { data } = await supabase.from('landlink_admin_actions')
    .select('id,admin_id,subject_type,subject_id,action,reason,created_at')
    .order('created_at', { ascending: false })
    .limit(100);
  if (!data || !data.length) { el.innerHTML = emptyHTML('Aucune action admin pour le moment'); return; }
  el.innerHTML = `<div style="font-family:ui-monospace,monospace;font-size:12px;line-height:1.7">
    ${data.map(a => `
      <div style="padding:8px 0;border-bottom:1px solid var(--line-soft)">
        ${new Date(a.created_at).toISOString().replace('T', ' ').slice(0, 19)} ·
        <b>${a.action}</b> ${a.subject_type}/${a.subject_id.slice(0, 8)}
        ${a.reason ? ' · ' + a.reason : ''}
      </div>`).join('')}
  </div>`;
}

// ----- shared row UI -----
function rowHTML({ title, sub, status, actions = [] }) {
  const btns = actions.filter(Boolean).map(a =>
    `<button class="${a.danger ? 'll-btn-ghost' : 'll-btn'}" data-kind="${a.kind}" data-id="${a.id}" data-action="${a.action}">${a.label}</button>`
  ).join(' ');
  return `<div class="ll-list-row">
    <div class="ll-list-body">
      <h4>${title} <span class="ll-badge ll-badge-${status?.replace('_','-')}">${status}</span></h4>
      <div class="meta">${sub}</div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${btns}</div>
  </div>`;
}
function emptyHTML(msg) { return `<div class="ll-empty"><h3 style="font-size:15px">${msg}</h3></div>`; }

function wireActions(scope) {
  scope.querySelectorAll('[data-kind]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const { kind, id, action } = btn.dataset;
      const reason = action === 'reject' ? prompt('Raison (optionnel) :', '') || null : null;
      btn.disabled = true;
      const session = (await supabase.auth.getSession()).data.session;
      if (!session) { alert('Non connecté.'); return; }
      const res = await fetch('/api/admin/moderate', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${session.access_token}`
        },
        body: JSON.stringify({ subject_type: kind, subject_id: id, action, reason })
      });
      const out = await res.json();
      if (!res.ok) { alert('Échec : ' + (out.error || res.status)); btn.disabled = false; return; }
      loadTab(state.tab);
      loadStats();
    });
  });
}

boot();
</script>

</body>
</html>
