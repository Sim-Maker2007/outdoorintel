<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Browse Private Land — LandLink</title>
<meta name="description" content="Browse private outdoor land across Canada. Hunting, camping, fishing, sugar shacks, dock access, ATV, snowmobile and more.">
<link rel="alternate" hreflang="en" href="https://landlink.outdoorintel.ca/en/parcels">
<link rel="alternate" hreflang="fr" href="https://landlink.outdoorintel.ca/fr/parcels">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="/public/css/landlink.css">
<style>
  body { overflow: hidden; }
  .ll-search-results { overflow-y: auto; }
</style>
</head>
<body>

<div class="ll-search-layout">
  <div class="ll-search-results">
    <div class="ll-filter-scroll" id="filters"></div>
    <div class="ll-search-count" id="count">Loading parcels...</div>
    <div class="ll-search-grid" id="grid"></div>
  </div>
  <div class="ll-map-pane">
    <div id="map"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
import { renderNav } from '/public/js/nav.js';
import {
  supabase, formatPrice, formatShortPrice, getActivities,
  activityIcon, activityLabel
} from '/public/js/supabase-client.js';
renderNav();

// ---------- state ----------
const state = {
  parcels: [],
  filtered: [],
  category: '',       // '' means all
  markers: new Map()
};

// ---------- filters (populated from activities.json) ----------
async function renderFilters() {
  const { activities } = await getActivities();
  const pills = [
    { code: '', label: 'All land', icon: '🌍' },
    ...activities.map(a => ({ code: a.code, label: a.short_en, icon: a.icon }))
  ];
  document.getElementById('filters').innerHTML = pills.map(p => `
    <button class="ll-filter-pill ${p.code === state.category ? 'active' : ''}" data-cat="${p.code}">
      <span>${p.icon}</span><span>${p.label}</span>
    </button>
  `).join('');
  document.getElementById('filters').addEventListener('click', e => {
    const btn = e.target.closest('.ll-filter-pill'); if (!btn) return;
    state.category = btn.dataset.cat;
    document.querySelectorAll('.ll-filter-pill').forEach(b => b.classList.toggle('active', b === btn));
    applyFilter();
    const url = new URL(location.href);
    if (state.category) url.searchParams.set('category', state.category); else url.searchParams.delete('category');
    history.replaceState(null, '', url);
  });
}

// ---------- map ----------
const map = L.map('map', { center: [56, -96], zoom: 4, minZoom: 3, maxZoom: 13, zoomControl: true });
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OSM' }).addTo(map);

// ---------- data load ----------
async function load() {
  const url = new URL(location.href);
  state.category = url.searchParams.get('category') || '';

  await renderFilters();
  await getActivities(); // preload taxonomy cache for icon lookups

  const { data, error } = await supabase
    .from('landlink_parcels')
    .select(`
      id,name,province,municipality,photos,acres,avg_rating,review_count,
      centroid_lat,centroid_lng,features,
      landlink_listings(id,category,activity_code,price_cents,price_unit,status,title)
    `)
    .eq('status', 'active')
    .order('created_at', { ascending: false })
    .limit(200);

  state.parcels = (!error && data && data.length) ? data : demoParcels();
  // Drop listings that aren't active for display
  state.parcels.forEach(p => {
    p.landlink_listings = (p.landlink_listings || []).filter(l => l.status === 'active' || !l.status);
  });
  applyFilter();
}

function applyFilter() {
  state.filtered = state.parcels.filter(p => {
    if (!state.category) return (p.landlink_listings || []).length > 0;
    return (p.landlink_listings || []).some(l => l.category === state.category);
  });
  render();
}

function render() {
  document.getElementById('count').textContent = `${state.filtered.length} ${state.filtered.length === 1 ? 'parcel' : 'parcels'}`;

  const grid = document.getElementById('grid');
  grid.innerHTML = state.filtered.map(cardHTML).join('') ||
    '<p class="ll-empty">No parcels match this filter yet.</p>';

  // map pins
  state.markers.forEach(m => map.removeLayer(m));
  state.markers.clear();
  const bounds = [];
  state.filtered.forEach(p => {
    if (!p.centroid_lat || !p.centroid_lng) return;
    const cheapest = cheapestListing(p);
    const label = cheapest
      ? (cheapest.price_unit === 'free' ? 'Free' : formatShortPrice(cheapest.price_cents))
      : '—';
    const marker = L.marker([p.centroid_lat, p.centroid_lng], {
      icon: L.divIcon({
        className: '', html: `<div class="ll-price-pin">${label}</div>`,
        iconSize: [60, 26], iconAnchor: [30, 13]
      })
    }).addTo(map);
    marker.on('click', () => { location.href = `/en/parcels/${p.id}`; });
    state.markers.set(p.id, marker);
    bounds.push([p.centroid_lat, p.centroid_lng]);
  });
  if (bounds.length) map.fitBounds(bounds, { padding: [40, 40], maxZoom: 8 });
}

function cheapestListing(p) {
  const listings = (p.landlink_listings || []).filter(l => {
    if (!state.category) return true;
    return l.category === state.category;
  });
  return listings.slice().sort((a, b) => (a.price_cents || 0) - (b.price_cents || 0))[0];
}

function cardHTML(p) {
  const photo = (p.photos && p.photos[0]) || demoPhoto(p.id);
  const rating = p.avg_rating ? Number(p.avg_rating).toFixed(1) : (p.review_count ? '—' : 'New');
  const reviews = p.review_count ? ` (${p.review_count})` : '';
  const loc = [p.municipality, p.province].filter(Boolean).join(', ');
  const listings = p.landlink_listings || [];
  const cheapest = cheapestListing(p);
  const cats = [...new Set(listings.map(l => l.category))].slice(0, 3)
    .map(c => `<span class="ll-pill">${activityIcon(c)} ${activityLabel(c)}</span>`).join('');
  const priceLabel = cheapest
    ? (cheapest.price_unit === 'free' ? 'Free access' : `from ${formatPrice(cheapest.price_cents, cheapest.price_unit)}`)
    : 'Multi-use';
  return `
    <a class="ll-card" href="/en/parcels/${p.id}" data-id="${p.id}">
      <div class="ll-card-img" style="background-image:url('${photo}')">
        ${listings.length > 1 ? `<div class="ll-card-badge">${listings.length} uses</div>` : ''}
      </div>
      <div class="ll-card-body">
        <div class="ll-card-row">
          <div class="ll-card-title">${p.name}</div>
          <div class="ll-card-rating">&#9733; ${rating}${reviews}</div>
        </div>
        <div class="ll-card-meta">${loc || '—'}${p.acres ? ` · ${p.acres} acres` : ''}</div>
        <div class="ll-card-pills">${cats}</div>
        <div class="ll-card-price"><strong>${priceLabel}</strong></div>
      </div>
    </a>`;
}

// ---------- demo fallback ----------
function demoPhoto(seed) {
  const photos = [
    'https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=600&auto=format&fit=crop',
    'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600&auto=format&fit=crop',
    'https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=600&auto=format&fit=crop',
    'https://images.unsplash.com/photo-1504280390367-361c6d9f38f4?w=600&auto=format&fit=crop',
    'https://images.unsplash.com/photo-1502082553048-f009c37129b9?w=600&auto=format&fit=crop',
    'https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=600&auto=format&fit=crop',
    'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600&auto=format&fit=crop',
    'https://images.unsplash.com/photo-1511497584788-876760111969?w=600&auto=format&fit=crop'
  ];
  let h = 0; for (const c of String(seed || '')) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return photos[h % photos.length];
}
